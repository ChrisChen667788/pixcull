<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
     width="1024" height="1024" role="img"
     aria-label="PixCull">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#f2ead9"/><stop offset="55%" stop-color="#dfcfae"/><stop offset="100%" stop-color="#c2a878"/></linearGradient>
    <radialGradient id="cosmicBg" cx="30%" cy="35%" r="80%"><stop offset="0%"  stop-color="#1e2024"/><stop offset="55%" stop-color="#17181a"/><stop offset="100%" stop-color="#101113"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#cosmicBg)"/>
  <ellipse cx="512" cy="512" rx="360" ry="360"
           fill="url(#brandGrad)" opacity="0.18"/>
  
<g transform="translate(176.00,176.00) scale(28)">
  <!-- the rest of the take, kept inside the bracket box: a stack that
       pokes out past the crop marks reads as untidy, not as depth -->
  <rect x="7.4" y="6.6" width="12" height="8" rx="0.6"
        fill="none" stroke="#43464d" stroke-width="0.28"/>
  <rect x="6.7" y="7.3" width="12" height="8" rx="0.6"
        fill="none" stroke="#5b5f68" stroke-width="0.28"/>
  <!-- the frame that was chosen -->
  <rect x="6" y="8" width="12" height="8" rx="0.6"
        fill="url(#brandGrad)"/>
  <!-- crop brackets, outside the frame edge so the mark never covers
       the picture; centred on 12,12 so it sits level in a round avatar -->
  <g fill="none" stroke="#e8a33c" stroke-width="0.66"
     stroke-linecap="square">
    <path d="M4 9.8 V6.4 H7.4"/>
    <path d="M20 9.8 V6.4 H16.6"/>
    <path d="M4 14.2 V17.6 H7.4"/>
    <path d="M20 14.2 V17.6 H16.6"/>
  </g>
</g>
</svg>
