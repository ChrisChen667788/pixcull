name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly + on-demand: the real-model lane (below) downloads CLIP + BLIP
  # to catch dependency drift the hermetic suite can't (e.g. transformers
  # 5.x silently changing the CLIP return type). Too heavy for every PR.
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

# CI notes
# --------
# PixCull's dependency graph (torch + torchvision + onnxruntime +
# transformers + rembg + insightface + opencv + rawpy) is heavy and
# some imports auto-download model weights on first call. The CI
# pins matched CPU wheels for torch + torchvision to dodge the
# torchvision::nms registration mismatch you'd otherwise hit on a
# Linux runner.
#
# Two jobs:
#   import — pip install resolves + import sanity (fast, must pass)
#   pytest — runs the local test suite minus the fixtures-required
#            test_v1_1_scripts.py file (matches the local
#            `pytest --ignore=tests/test_v1_1_scripts.py` invocation
#            that gets 240/240 on the maintainer's Apple Silicon)

jobs:
  import:
    name: install + import smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU-pinned torch family + project)
        env:
          # Make PyTorch's CPU index the preferred source for any
          # torch-family package. Without this, pip resolves
          # torchvision to a CUDA wheel that doesn't match the CPU
          # torch we installed first — symptom is
          # "operator torchvision::nms does not exist" at import.
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          # Pin a matched torch + torchvision CPU pair so the
          # editable-install step below doesn't upgrade one half of
          # the pair against the other.
          pip install --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple \
                      "torch==2.4.1" "torchvision==0.19.1"
          pip install -e ".[dev]"

      - name: Resolved versions
        run: |
          python --version
          pip list | head -60

      - name: Import sanity
        run: |
          python -c "import pixcull; print('pixcull: ok')"
          python -c "from pixcull.scoring.rubric import RUBRIC_AXES; print(f'axes: {[a.name for a in RUBRIC_AXES]}')"
          python -c "from pixcull.scoring.photo_advice import build_advice; print('photo_advice: ok')"
          python -c "from pixcull.scoring.decision import decide; print('decision: ok')"
          python -c "import pixcull.tether; print('tether: ok')"
          python -c "import pixcull.sync; print('sync: ok')"

  browser:
    # v3.42 — playwright has never been installed on a runner, so every
    # test in these three files has been reporting green by skipping.
    #
    # `pytest.importorskip("playwright.sync_api")` at the top of each
    # file is the correct local behaviour and the wrong CI behaviour:
    # `test_lightbox_stability.py` even says in its own docstring that
    # it uses "the same launch-a-real-chromium path as test_visual_smoke
    # (which is green in CI)". test_visual_smoke was green in CI because
    # it never ran. Fourth instance of skip-as-a-pass in this repo.
    #
    # Its own job, not folded into the hermetic one, so a red run says
    # which lane broke and so the chromium download does not sit in
    # front of every other assertion.
    name: browser (playwright)
    runs-on: ubuntu-latest
    needs: import
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple \
                      "torch==2.4.1" "torchvision==0.19.1"
          pip install -e ".[dev]"
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          pytest -q -p no:randomly \
            tests/test_visual_smoke.py \
            tests/test_lightbox_stability.py \
            tests/test_client_present.py \
            tests/test_readme_images_render.py

      - name: Prove the browser actually launched
        # The whole point of this job. Before this version the three
        # files above skipped on a missing import and the tick was
        # green, so the tick has to be tied to something the skip path
        # cannot satisfy.
        run: |
          python -c "import playwright.sync_api; print('playwright: importable')"
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              pg = b.new_page(); pg.set_content("<b id=x>hi</b>")
              assert pg.inner_text("#x") == "hi"
              b.close()
          print("chromium: launched")
          EOF

  pytest:
    name: pytest (hermetic subset)
    runs-on: ubuntu-latest
    needs: import
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple \
                      "torch==2.4.1" "torchvision==0.19.1"
          pip install -e ".[dev]"

      # v3.41 — exiftool is what makes the embedded-IPTC test run
      # instead of skip.
      #
      # v3.28 fixed a writer that was destroying hand-set ratings and
      # keywords INSIDE the photograph, with -overwrite_original so
      # exiftool kept no backup. The fix is asserted through a pure
      # function that builds the command line, which proves the
      # arguments are right and proves nothing about what exiftool does
      # with them. Three of its behaviours were taken on trust.
      #
      # Same reasoning as the ffmpeg step: a test that skips because a
      # binary is missing reports green having tested nothing, and this
      # repo has been bitten by skip-as-a-pass three times now.
      - name: Install exiftool (embedded-IPTC effect test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl

      # v2.45 — ffmpeg is what makes the video tests run instead of
      # skip. Without it _tiny_video() bails out and they report green
      # while testing nothing.
      #
      # v3.48 — this step used to sit after the hermetic run, where it
      # served the end-to-end video journey alone. So v2.45's lesson
      # landed one step too late in the file: thirty-nine tests in the
      # hermetic run — the whole of test_video, test_reel_assembly,
      # test_edit_render, test_raw_proxy and test_audio_events — skipped
      # on every push from the day the video block shipped. Found by
      # reading the CI log's SKIPPED lines rather than by accident,
      # which is the fifth time this shape has turned up here.
      #
      # An install step only fixes the tests that come AFTER it. Both of
      # these have to stay above the run below; a guard in
      # tests/test_writers_do_not_overwrite.py holds them there.
      - name: Install ffmpeg (video tests + the journey)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run hermetic tests
        run: |
          # Skip:
          #   - test_v1_1_scripts.py    fixtures not in public repo
          #   - test_v1_2_rescorer_integration.py joblib weights not in public repo
          # The remaining suite is hermetic (no model download
          # required for the assertions we check).
          # -m "not slow" leaves out the one journey that runs the real
          # pipeline; it needs weights and lives in the realmodel lane.
          pytest -q -m "not slow" \
            --ignore=tests/test_v1_1_scripts.py \
            --ignore=tests/test_v1_2_rescorer_integration.py

      # v2.41 — the journey, separately, so a red run says WHICH failed.
      # DESIGN-AUDIT-2031Q1: this repo's most common defect is a live
      # feature no real user path can reach. Four shipped that way
      # (library index resolving nothing, video runs unserveable, light
      # theme never applying, export exiting silently) with the unit
      # suite green throughout, because unit tests exercise functions
      # and those were broken journeys. Each of the four was replayed as
      # a mutation and this file caught all four.
      - name: End-to-end smoke (run -> serve -> export, video -> cut -> render)
        run: pytest -q -m "not slow" tests/test_e2e_smoke.py

  realmodel:
    name: real-model integration (CLIP + VLM)
    runs-on: ubuntu-latest
    # Only on the weekly schedule / manual dispatch — these download
    # model weights, so they don't gate every PR. They assert the
    # transformers/torch return-type contract the hermetic suite can't:
    # the silent semantic-search break under transformers 5.x would have
    # been caught here.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple \
                      "torch==2.4.1" "torchvision==0.19.1"
          pip install -e ".[dev]"
      - name: Real-model integration tests (downloads CLIP + BLIP)
        run: |
          pytest -q \
            tests/test_semantic_search.py::test_build_search_real_clip_end_to_end \
            tests/test_reel_caption.py::test_vlm_caption_real_model
