<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420"
     width="1280" height="420" role="img"
     aria-label="PixCull — LOCAL-FIRST AI PHOTO CULLING">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#f2ead9"/><stop offset="55%" stop-color="#dfcfae"/><stop offset="100%" stop-color="#c2a878"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#1e2024"/>
      <stop offset="100%" stop-color="#101113"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" fill="url(#ground)"/>

  <!-- Film-edge rule along the bottom. One accent, the same one the
       crop brackets use, so the colour keeps meaning "chosen". -->
  <rect x="0" y="415" width="1280" height="5" fill="#e8a33c"
        opacity="0.85"/>

  
<g transform="translate(109.60,109.60) scale(7.2)">
  <!-- the rest of the take, kept inside the bracket box: a stack that
       pokes out past the crop marks reads as untidy, not as depth -->
  <rect x="7.4" y="6.6" width="12" height="8" rx="0.6"
        fill="none" stroke="#43464d" stroke-width="0.28"/>
  <rect x="6.7" y="7.3" width="12" height="8" rx="0.6"
        fill="none" stroke="#5b5f68" stroke-width="0.28"/>
  <!-- the frame that was chosen -->
  <rect x="6" y="8" width="12" height="8" rx="0.6"
        fill="url(#brandGrad)"/>
  <!-- crop brackets, outside the frame edge so the mark never covers
       the picture; centred on 12,12 so it sits level in a round avatar -->
  <g fill="none" stroke="#e8a33c" stroke-width="0.66"
     stroke-linecap="square">
    <path d="M4 9.8 V6.4 H7.4"/>
    <path d="M20 9.8 V6.4 H16.6"/>
    <path d="M4 14.2 V17.6 H7.4"/>
    <path d="M20 14.2 V17.6 H16.6"/>
  </g>
</g>

  <!-- A hairline between the mark and the type: the two halves are one
       lockup, not a logo that happens to sit near some words. -->
  <rect x="330" y="104" width="2" height="184" fill="#8b8f97"
        opacity="0.30"/>

  <text x="382" y="196" font-family="'Charter','Iowan Old Style','PT Serif','Source Serif Pro','Cambria',Georgia,'Songti SC','STZhongsong',serif"
        font-size="96" font-weight="700" letter-spacing="-2"
        fill="#f2ead9">
    Pix<tspan fill="url(#brandGrad)">Cull</tspan>
  </text>
  <text x="386" y="238" font-family="-apple-system,'Inter','Segoe UI Variable','Segoe UI','PingFang SC','Microsoft Yahei UI',system-ui,sans-serif"
        font-size="19" font-weight="600" letter-spacing="3.4"
        fill="#e8a33c">
    LOCAL-FIRST AI PHOTO CULLING
  </text>
  <text x="386" y="278" font-family="-apple-system,'Inter','Segoe UI Variable','Segoe UI','PingFang SC','Microsoft Yahei UI',system-ui,sans-serif"
        font-size="22" font-weight="400" fill="#d6d3cd">
    本地 AI 帮你 6 秒挑出一晚要拍的全部精选。
  </text>
  <text x="1236" y="386" text-anchor="end"
        font-family="-apple-system,'Inter','Segoe UI Variable','Segoe UI','PingFang SC','Microsoft Yahei UI',system-ui,sans-serif" font-size="13" font-weight="500"
        fill="#8b8f97" letter-spacing="1.4">
    github.com/ChrisChen667788/pixcull
  </text>
</svg>
