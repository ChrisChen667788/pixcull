<?xml version="1.0" encoding="utf-8"?>
<!--
  GitHub social card, 1280x640. Shown at about 600px wide in a link
  preview, so everything here has to survive being halved: no body copy,
  three words of subtitle, and type that is large before it is small.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640"
     width="1280" height="640" role="img"
     aria-label="PixCull — local-first AI photo culling">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#1e2024"/><stop offset="100%" stop-color="#101113"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f2ead9"/><stop offset="100%" stop-color="#c2a878"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#ground)"/>
  <rect x="0" y="632" width="1280" height="8" fill="#e8a33c" opacity="0.85"/>

  <g transform="translate(568.00,109.00) scale(6.4)">
    <rect x="7.4" y="6.6" width="12" height="8" rx="0.6" fill="none" stroke="#43464d" stroke-width="0.28"/>
    <rect x="6.7" y="7.3" width="12" height="8" rx="0.6" fill="none" stroke="#5b5f68" stroke-width="0.28"/>
    <rect x="6" y="8" width="12" height="8" rx="0.6" fill="url(#paper)"/>
    <g fill="none" stroke="#e8a33c" stroke-width="0.66" stroke-linecap="square">
      <path d="M4 9.8 V6.4 H7.4"/><path d="M20 9.8 V6.4 H16.6"/>
      <path d="M4 14.2 V17.6 H7.4"/><path d="M20 14.2 V17.6 H16.6"/>
    </g>
  </g>

  <text x="640" y="344" text-anchor="middle"
        font-family="'Charter','Iowan Old Style','PT Serif','Cambria',Georgia,serif"
        font-size="112" font-weight="700" letter-spacing="-2.5"
        fill="#f2ead9">Pix<tspan fill="url(#paper)">Cull</tspan></text>
  <text x="640" y="396" text-anchor="middle"
        font-family="-apple-system,'Inter','Segoe UI','PingFang SC',system-ui,sans-serif"
        font-size="23" font-weight="600" letter-spacing="5" fill="#e8a33c">
    LOCAL-FIRST AI PHOTO CULLING
  </text>
  <text x="640" y="452" text-anchor="middle"
        font-family="-apple-system,'Inter','Segoe UI','PingFang SC',system-ui,sans-serif"
        font-size="26" font-weight="400" fill="#d6d3cd">
    六维评分 · 逐张写明理由 · RAW 不出本机
  </text>
  <text x="640" y="524" text-anchor="middle"
        font-family="-apple-system,'Inter','Segoe UI',system-ui,sans-serif"
        font-size="15" font-weight="500" letter-spacing="1.6" fill="#8b8f97">
    MIT · github.com/ChrisChen667788/pixcull
  </text>
</svg>
