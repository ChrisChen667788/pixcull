[project]
name = "pixcull"
version = "2.56.3"
description = "AI photo culling for professional photographers — MiniMax M3 judges the frame while reading the on-device measurements, 6-axis rubric, XMP/IPTC export, Lightroom & Capture One ready."
# v2.23 — dedicated PyPI readme: the repo README leans on relative-path
# screenshots and GitHub-only markup that render broken on pypi.org.
readme = "README-PYPI.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
    { name = "Chris Chen", email = "hello@pixcull.dev" },
]
keywords = [
    "photography", "photo-culling", "ai", "computer-vision",
    "image-classification", "rubric-scoring", "lightroom", "capture-one",
    "xmp", "iptc", "raw-photography", "wedding-photography",
    "image-quality-assessment", "vision-language-model", "minimax-m3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # core
    # numpy upper bound: mediapipe 0.10.x is built against numpy 1.x;
    # importing it under numpy 2.x silently fails to load the face
    # detector (V18.1 + V22.0.1 both bit us). Also: rescorer joblibs
    # serialized under numpy 2.x use ``numpy.random._pcg64.PCG64``
    # paths that 1.x can't unpickle (V18.3 ABI break). Until mediapipe
    # ships numpy-2-compatible wheels, pin to <2.
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "Pillow>=10.2",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    # CV
    "opencv-python>=4.9",
    "rawpy>=0.19",
    # DL — upper bounds added after transformers 5.x silently changed
    # CLIP get_image_features/get_text_features to return a
    # BaseModelOutputWithPooling (not a tensor), which broke semantic
    # search until `_feature_tensor` shimmed both shapes. Cap the majors
    # so a future 6.x / torch 3.x can't drift in untested; bump
    # deliberately once the real-model CI lane is green on the new major.
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "transformers>=4.40,<6",
    "safetensors>=0.4",
    # subject segmentation (U^2-Net)
    "rembg>=2.0.57",
    "onnxruntime>=1.17",
    # V22.0.1 — face identity embeddings (ArcFace via buffalo_l ONNX
    # bundle, ~280 MB auto-download into ~/.insightface/models/ on
    # first use). Drop-in replacement for the V22.0 CLIP face embedder;
    # CLIP collapsed real-world multi-person batches into single
    # clusters (see V24 audit). InsightFace gives ~0.4-0.7 inter-
    # person vs ~0.05-0.3 intra-person cosine distance, which DBSCAN
    # splits reliably at ε=0.50.
    "insightface>=0.7",
    # aesthetic / IQA metrics
    "pyiqa>=0.1.11",
    # duplicate detection
    "imagededup>=0.3.2",
    # v2.48 — the OpenAI SDK is the client for every OpenAI-compatible
    # endpoint we speak to (MiniMax M3, DeepSeek, OpenAI itself). FIVE
    # first-party modules import it — m3, vlm_judge, meta_judge,
    # caption_gen, phrase_generator — and NONE of them declared it, so on
    # a fresh `pip install pixcull` every one of those paths raised
    # ModuleNotFoundError. Each import is inside a try/except that turns
    # it into `verdict.error`, so the feature did not crash; it just
    # quietly did nothing. That predates M3 by months.
    #
    # Core rather than an extra: pure Python, no compile step, and with
    # M3 as the primary judge this is no longer an optional path.
    "openai>=1.40",
    # templating
    "jinja2>=3.1",
    # storage
    "sqlmodel>=0.0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # v2.43.4 — tests/test_packaging.py builds the real sdist+wheel and
    # inspects them. With hatchling present it does so without isolation
    # (~0.1s instead of ~3s), so declare both rather than let the test
    # quietly take the slow path or skip.
    "build>=1.0",
    "hatchling>=1.20",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-Pillow",
]
face = [
    "mediapipe>=0.10.14",
]
bird = [
    "ultralytics>=8.2",       # YOLOv8
    "segment-anything>=1.0",  # Meta SAM
]
# v2.41-P1 — opt-in shot-boundary detection. PySceneDetect is BSD-3 and
# OpenCV-based (opencv is already a core dep), so this adds no compiled
# dependency and keeps `pip install pixcull` free of build steps.
# Without it, reel windows simply aren't split at cuts — the pre-v2.41
# behaviour, not an error.
# NB numpy: scenedetect declares no upper bound, so installing it OUTSIDE
# this project's constraints pulls numpy 2.x and silently breaks
# mediapipe + the rescorer joblibs. The core `numpy>=1.26,<2` pin above
# holds it down for anyone installing `pixcull[shots]`.
shots = [
    "scenedetect>=0.6",
]
# v2.43-P0 — opt-in speech transcription. Both engines are large and
# BOTH leave numpy unpinned, which is exactly how v2.42 pulled numpy 2.x
# and broke mediapipe; the core `numpy>=1.26,<2` pin holds them down when
# installed as an extra, but a bare `pip install funasr` will not be.
#
# asr          = Paraformer via FunASR (MIT, Alibaba TONGYI) — the model
#                FunClip is built on. Mandarin-first; weights on
#                ModelScope, which PixCull already mirrors to.
# asr-whisper  = broader language coverage. faster-whisper is the lighter
#                runtime; plain openai-whisper also works if present.
asr = [
    "funasr>=1.1",
    # v2.43.2 — funasr 1.4.0 does `import torchaudio` unconditionally in
    # funasr/utils/load_utils.py but omits it from its own requirements,
    # so a plain `pip install "pixcull[asr]"` installed an engine that
    # crashed on first use. Declared here because we cannot fix upstream.
    "torchaudio>=2.0",
]
asr-whisper = [
    "faster-whisper>=1.0",
]
# v2.43.1 — Apple Silicon: MLX runs Whisper on the Metal GPU. Measured on
# an M1 Max, this is 2 new packages against FunASR's 28 (mlx and most of
# Whisper's deps are usually already present), and 5x realtime once the
# weights are resident. transcribe.py prefers it over faster-whisper when
# importable.
asr-mlx = [
    "mlx-whisper>=0.4",
]
# v0.10-P0-2 — opt-in mDNS auto-discovery for LAN sync sessions.
# Without this extra, /sync still works (paste URL or scan QR), but
# the auto-detect-host-on-LAN toast doesn't fire.
sync = [
    "zeroconf>=0.131",
]

[project.urls]
Homepage      = "https://github.com/ChrisChen667788/pixcull"
Repository    = "https://github.com/ChrisChen667788/pixcull"
Issues        = "https://github.com/ChrisChen667788/pixcull/issues"
Documentation = "https://github.com/ChrisChen667788/pixcull#readme"
ModelScope    = "https://www.modelscope.cn/profile/haozi667788"

[project.scripts]
pixcull = "pixcull.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixcull"]

[tool.hatch.build]
# This list is an ALLOWLIST and it applies to the sdist as well as the
# wheel.  v2.43.4: it had no *.py pattern, so every published sdist
# contained zero Python files — and because `python -m build` (what
# release.yml runs) builds the wheel *from the sdist*, every wheel on
# every GitHub Release since v2.23 shipped 35 data files and no code.
#
# `python -m build --wheel` builds straight from the source tree, where
# the wheel target's `packages` applies, and looks perfectly fine.  That
# is why this survived: the only local command anyone ran was the one
# that bypasses the sdist.
#
# Anything added here must keep the sdist self-sufficient.  The test in
# tests/test_packaging.py builds both artifacts and checks them.
include = [
    "pixcull/**/*.py",
    "pixcull/scoring/templates/*.yaml",
    "pixcull/scoring/data/*.json",        # v2.4-P1-3 — calibrated audio thresholds ship with the package
    "pixcull/scoring/data/*.txt",         # v2.44 — Mandarin ASR hotword lexicon (caught by test_packaging: a .json-only glob silently dropped it)
    "pixcull/report/templates/*.j2",
    "pixcull/report/templates/*.html",   # V19.4.1 — results.html is loaded from disk at runtime
    "pixcull/report/templates/pages/*.html",  # v2.16-P0 — serve_demo page templates (extracted blobs)
    "pixcull/locale/*.json",             # v2.23 — 13-locale i18n strings load at runtime; without these _t() falls back to keys
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "slow: end-to-end journeys that run the real pipeline (needs model weights)",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
