<?xml version="1.0" encoding="utf-8"?>
<!--
  README closing image.

  The one it replaces used a blue-grey palette while the brand lockup at
  the top of the same file used brown and tan, so the two did not look
  like one project. This uses the brand palette and nothing else.

  The right half is not a mock of the interface. It is the thing the
  product does, drawn plainly: three frames from the same take, each
  carrying its verdict and the six axis readings behind it, and one of
  them marked. A fake screenshot in a hero image is a promise the
  software has to keep on the reader's first run.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400"
     width="1280" height="400" role="img"
     aria-label="PixCull — local-first AI photo culling: three frames from one take, scored on six axes, one marked">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#1e2024"/><stop offset="100%" stop-color="#101113"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f2ead9"/><stop offset="100%" stop-color="#c2a878"/>
    </linearGradient>
    <linearGradient id="paperDim" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#6a6d74"/><stop offset="100%" stop-color="#4a4d54"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#ground)"/>
  <rect x="0" y="395" width="1280" height="5" fill="#e8a33c" opacity="0.85"/>

  <!-- Mark -->
  <g transform="translate(72.00,88.00) scale(4.6)">
    <rect x="7.4" y="6.6" width="12" height="8" rx="0.6" fill="none" stroke="#43464d" stroke-width="0.28"/>
    <rect x="6.7" y="7.3" width="12" height="8" rx="0.6" fill="none" stroke="#5b5f68" stroke-width="0.28"/>
    <rect x="6" y="8" width="12" height="8" rx="0.6" fill="url(#paper)"/>
    <g fill="none" stroke="#e8a33c" stroke-width="0.66" stroke-linecap="square">
      <path d="M4 9.8 V6.4 H7.4"/><path d="M20 9.8 V6.4 H16.6"/>
      <path d="M4 14.2 V17.6 H7.4"/><path d="M20 14.2 V17.6 H16.6"/>
    </g>
  </g>

  <text x="72" y="252" font-family="'Charter','Iowan Old Style','PT Serif','Cambria',Georgia,serif"
        font-size="62" font-weight="700" letter-spacing="-1.5" fill="#f2ead9">Pix<tspan fill="url(#paper)">Cull</tspan></text>
  <text x="74" y="286" font-family="-apple-system,'Inter','Segoe UI','PingFang SC',system-ui,sans-serif"
        font-size="15" font-weight="600" letter-spacing="3" fill="#e8a33c">LOCAL-FIRST AI PHOTO CULLING</text>
  <text x="74" y="320" font-family="-apple-system,'Inter','Segoe UI','PingFang SC',system-ui,sans-serif"
        font-size="17" font-weight="400" fill="#d6d3cd">Six axes, a written reason, and the RAW files stay on your machine.</text>

  <!-- Three frames from one take. Two dimmed, one marked. -->
  <g transform="translate(600,86)">
    <!-- frame 1 — kept -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="180" height="120" rx="8" fill="url(#paper)"/>
      <g fill="none" stroke="#e8a33c" stroke-width="5" stroke-linecap="square">
        <path d="M-14 26 V-14 H26"/><path d="M194 26 V-14 H154"/>
        <path d="M-14 94 V134 H26"/><path d="M194 94 V134 H154"/>
      </g>
      <rect x="0" y="150" width="180" height="6" rx="3" fill="#63bd7f"/>
      <text x="0" y="182" font-family="-apple-system,'Inter',system-ui,sans-serif"
            font-size="13" font-weight="700" letter-spacing="1.4" fill="#63bd7f">KEEP</text>
      <text x="0" y="204" font-family="-apple-system,'Inter','PingFang SC',system-ui,sans-serif"
            font-size="12" fill="#8b8f97">眼神到位,峰值动作</text>
    </g>
    <!-- frame 2 — maybe -->
    <g transform="translate(230,0)">
      <rect x="0" y="0" width="180" height="120" rx="8" fill="url(#paperDim)"/>
      <rect x="0" y="150" width="180" height="6" rx="3" fill="#d6a443"/>
      <text x="0" y="182" font-family="-apple-system,'Inter',system-ui,sans-serif"
            font-size="13" font-weight="700" letter-spacing="1.4" fill="#d6a443">MAYBE</text>
      <text x="0" y="204" font-family="-apple-system,'Inter','PingFang SC',system-ui,sans-serif"
            font-size="12" fill="#8b8f97">构图偏弱,其余尚可</text>
    </g>
    <!-- frame 3 — cull -->
    <g transform="translate(460,0)">
      <rect x="0" y="0" width="180" height="120" rx="8" fill="url(#paperDim)" opacity="0.55"/>
      <rect x="0" y="150" width="180" height="6" rx="3" fill="#e0604e"/>
      <text x="0" y="182" font-family="-apple-system,'Inter',system-ui,sans-serif"
            font-size="13" font-weight="700" letter-spacing="1.4" fill="#e0604e">CULL</text>
      <text x="0" y="204" font-family="-apple-system,'Inter','PingFang SC',system-ui,sans-serif"
            font-size="12" fill="#8b8f97">闭眼,且同组有更好的</text>
    </g>
  </g>
</svg>
